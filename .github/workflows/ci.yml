name: CI

# Fast code checks on every PR and on pushes to main. This does NOT audit the live sites
# (that is qa-monster.yml, on a schedule); it only proves the code itself is sound.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Validate Playwright config and specs (no network)
        run: npx playwright test --list
